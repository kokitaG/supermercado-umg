name: CI - SonarQube Cloud Analysis

on:
  push:
    branches:
      - desarrollo
  workflow_dispatch:

jobs:
  build-and-analyze:
    name: Build, Test & SonarQube Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias de prueba
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Ejecutar pruebas unitarias con cobertura
        run: |
          pytest backend/tests --cov=backend/app --cov-report=xml:coverage.xml

      - name: Ejecutar SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=kokitag
            -Dsonar.projectKey=kokitaG_supermercado-umg
